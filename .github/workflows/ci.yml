name: CI Front

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Build and analyze frontend
    runs-on: ubuntu-latest

    steps:
      # récupération du dépôt front
      - name: Retrieve repository
        uses: actions/checkout@v7
        with:
          # historique complet nécessaire à Sonar
          fetch-depth: 0

      # installation de Node.js
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # installation exacte des dépendances du package-lock.json
      - name: Install frontend dependencies
        run: npm ci

      # vérification de la qualité du code
      - name: Run frontend lint
        run: npm run lint

      # vérification du formatage sans modifier les fichiers
      - name: Check frontend formatting
        run: npm run format:check

      # compilation avec la configuration Angular de production
      - name: Build production frontend
        run: npm run build -- --configuration=production

      # analyse Sonar sur les PR et sur main
      - name: Analyze frontend with SonarQube Cloud
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name == 'pull_request'
          || github.ref == 'refs/heads/main')
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # préparation de la construction Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # connexion à GHCR uniquement sur main
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # construction sur toutes les branches et publication sur main
      - name: Build and publish frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          push: >-
            ${{ github.event_name == 'push'
            && github.ref == 'refs/heads/main' }}

          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}